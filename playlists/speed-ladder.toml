# Speed ladder, second run (owner, 2026-10-28: too slow is no concern; 100 px/s was the first
# smooth step, 400 still acceptable but too brief to judge): straight pans of 1536 screen pixels
# (about 80% of a 1920-wide window) at zoom -2, -1, 0 and 1, each at 200, 300, 400, 600 and
# 800 px/s in that order, with 2 s still before each. Rate each: smooth, acceptable or too fast.
# No angle or zoom changes, and no zooming out (zoom_threshold is set out of reach). About 2 min.
# The first run (512 px at 25-400 px/s) is in the git history.
# Install (close OpenRCT2 first), with the camera log to confirm the speeds:
#   python3 tools/mksequence.py playlists/speed-ladder.toml --install --ignore-edits --keep-palette --camera-log
#   python3 tools/cameralog.py build/openrct2-run.log
# Paths are relative to this file. Installing it replaces the installed playlist.

name = "RCT Screensaver Speed Ladder"
order = "playlist"
layout = "plugin"

[views]
fit = false             # play the views exactly as listed
zoom_threshold = 100000 # never travel zoomed out

[[park]]
file = "../ExampleParks/220710-rct2-j_k-ghillie_dhu.zip"
name = "Ghillie Dhu (speed ladder)"
view = [
