# Builds OpenRCT2 at the release in engine/VERSION with the patches in engine/patches applied,
# the same way OpenRCT2's own CI builds its binaries.
# - Windows x64: openrct2.exe and openrct2.com, which replace the two files of the same name in a
#   stock OpenRCT2 install.
# - Linux x64: a whole portable build (a tarball of the install tree: the binary, libopenrct2.so and
#   the data folder), as OpenRCT2's "Ubuntu Linux (noble, x86_64, portable)" job makes it, since Linux
#   installs vary too much to replace files in one.
# - Linux x64 AppImage: the same build bundled with its libraries (OpenRCT2's AppImage recipe), for
#   distributions whose libraries differ from Ubuntu 24.04's (Fedora: ICU, libzip).
# - With "publish_tag" on a release build: a draft GitHub release holding the Windows zip and the
#   AppImage (labeled beta), its notes from docs/releases/<tag>.md. Publishing it stays a click on
#   the release page.
name: Engine build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release build: leave out the diagnostics patch (0018)"
        type: boolean
        default: false
      publish_tag:
        description: "Make a draft GitHub release with this tag (e.g. v0.2.0; needs Release build). Notes: docs/releases/<tag>.md"
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"

env:
  OPENRCT2_BUILD_SERVER: openrct2-screensaver
  PLATFORM: x64
  CONFIGURATION: Release

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout openrct2-screensaver
        uses: actions/checkout@v4
      - name: Read the OpenRCT2 version
        id: version
        shell: bash
        run: |
          ref=$(tr -d '[:space:]' < engine/VERSION)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "OPENRCT2_VERSION=${ref#v}" >> "$GITHUB_ENV"
      - name: Checkout OpenRCT2 ${{ steps.version.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: OpenRCT2/OpenRCT2
          ref: ${{ steps.version.outputs.ref }}
          path: openrct2
      - name: Apply patches
        shell: bash
        working-directory: openrct2
        run: |
          for p in ../engine/patches/*.patch; do
            if [ "${{ inputs.release }}" = "true" ] && [[ "$(basename "$p")" == 0018-* ]]; then
              echo "== $p (left out of the release build)"
              continue
            fi
            echo "== $p"
            git apply --verbose "$p"
          done
      - name: Build OpenRCT2
        shell: bash
        working-directory: openrct2
        run: |
          export DISTANCE_FROM_TAG=0
          . scripts/setenv && build
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: openrct2-${{ steps.version.outputs.ref }}-openrct2-screensaver-x64${{ inputs.release == true && '-release' || '' }}
          path: |
            openrct2/bin/openrct2.exe
            openrct2/bin/openrct2.com
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    # OpenRCT2's own build image for its Ubuntu 24.04 portable job at this release (its ci.yml)
    container: ghcr.io/openrct2/openrct2-build:26-noble
    steps:
      - name: Checkout openrct2-screensaver
        uses: actions/checkout@v4
      - name: Read the OpenRCT2 version
        id: version
        shell: bash
        run: |
          ref=$(tr -d '[:space:]' < engine/VERSION)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "OPENRCT2_VERSION=${ref#v}" >> "$GITHUB_ENV"
      - name: Checkout OpenRCT2 ${{ steps.version.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: OpenRCT2/OpenRCT2
          ref: ${{ steps.version.outputs.ref }}
          path: openrct2
      - name: Apply patches
        shell: bash
        working-directory: openrct2
        run: |
          # The container runs as root over a workspace owned by the runner's user
          git config --global --add safe.directory '*'
          for p in ../engine/patches/*.patch; do
            if [ "${{ inputs.release }}" = "true" ] && [[ "$(basename "$p")" == 0018-* ]]; then
              echo "== $p (left out of the release build)"
              continue
            fi
            echo "== $p"
            git apply --verbose "$p"
          done
          # CMake takes the version string's branch from git: "--version" then names this build
          git checkout -b openrct2-screensaver
      - name: Get pre-reqs
        shell: bash
        working-directory: openrct2
        run: . scripts/setenv && get-discord-rpc
      - name: Build OpenRCT2
        shell: bash
        working-directory: openrct2
        run: |
          export DISTANCE_FROM_TAG=0
          . scripts/setenv -q && build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DPORTABLE=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=on -DWITH_TESTS=off
      - name: Make the tarball
        id: tarball
        shell: bash
        working-directory: openrct2
        run: |
          name=openrct2-${{ steps.version.outputs.ref }}-openrct2-screensaver-linux-x64${{ inputs.release == true && '-release' || '' }}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          . scripts/setenv -q && build-portable "artifacts/$name.tar.gz" bin/install/usr
          # The tree the tarball must hold (a listing piped into head would end the step with SIGPIPE)
          tar -tzf "artifacts/$name.tar.gz" > contents.txt
          for f in "OpenRCT2/openrct2" "OpenRCT2/openrct2-cli" "OpenRCT2/libopenrct2\.so.*" "OpenRCT2/data/g2\.dat"; do
            grep -qxE "$f" contents.txt || { echo "missing from the tarball: $f"; exit 1; }
          done
          ./bin/openrct2-cli --version || true
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: openrct2/artifacts/${{ steps.tarball.outputs.name }}.tar.gz
          if-no-files-found: error

  linux-appimage:
    name: Linux x64 AppImage
    runs-on: ubuntu-24.04
    # OpenRCT2's own AppImage job at this release: built on Ubuntu 22.04 with clang, and linuxdeploy
    # bundles the libraries, so it runs on distributions whose library versions differ from Ubuntu's
    # (Fedora lacks the ICU 74 and libzip 4 the portable tarball links)
    container: openrct2/openrct2-build:24-jammy
    steps:
      - name: Checkout openrct2-screensaver
        uses: actions/checkout@v4
      - name: Read the OpenRCT2 version
        id: version
        shell: bash
        run: |
          ref=$(tr -d '[:space:]' < engine/VERSION)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "OPENRCT2_VERSION=${ref#v}" >> "$GITHUB_ENV"
      - name: Checkout OpenRCT2 ${{ steps.version.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: OpenRCT2/OpenRCT2
          ref: ${{ steps.version.outputs.ref }}
          path: openrct2
      - name: Apply patches
        shell: bash
        working-directory: openrct2
        run: |
          git config --global --add safe.directory '*'
          for p in ../engine/patches/*.patch; do
            if [ "${{ inputs.release }}" = "true" ] && [[ "$(basename "$p")" == 0018-* ]]; then
              echo "== $p (left out of the release build)"
              continue
            fi
            echo "== $p"
            git apply --verbose "$p"
          done
          git checkout -b openrct2-screensaver
      - name: Get pre-reqs
        shell: bash
        working-directory: openrct2
        run: . scripts/setenv -q && get-discord-rpc
      - name: Build OpenRCT2
        shell: bash
        working-directory: openrct2
        run: |
          export DISTANCE_FROM_TAG=0
          . scripts/setenv -q && build -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_BUILD_TYPE=Release -DAPPIMAGE=ON
      - name: Build the AppImage
        id: appimage
        shell: bash
        working-directory: openrct2
        env:
          NO_STRIP: true
        run: |
          name=openrct2-${{ steps.version.outputs.ref }}-openrct2-screensaver-linux-x64${{ inputs.release == true && '-release' || '' }}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          export APPIMAGE_FILE_NAME="$name.AppImage"
          # The install step also puts the static libopenrct2.a in the tree (30 MB), which nothing
          # loads at run time: the programs link it in
          find bin/install -name 'libopenrct2.a' -print -delete
          . scripts/setenv -q && build-appimage
          ./bin/openrct2-cli --version || true
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appimage.outputs.name }}-appimage
          path: openrct2/artifacts/${{ steps.appimage.outputs.name }}.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    if: github.event_name == 'workflow_dispatch' && inputs.release && inputs.publish_tag != ''
    needs: [windows, linux-appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.publish_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout openrct2-screensaver
        uses: actions/checkout@v4
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: builds
      - name: Make the release files
        id: files
        shell: bash
        run: |
          ref=$(tr -d '[:space:]' < engine/VERSION)
          test -f "docs/releases/$TAG.md" || { echo "missing release notes: docs/releases/$TAG.md"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then echo "release $TAG exists already"; exit 1; fi
          mkdir dist
          win=openrct2-$ref-openrct2-screensaver-x64-release
          (cd "builds/$win" && zip -9 "../../dist/$win.zip" openrct2.exe openrct2.com)
          app=openrct2-$ref-openrct2-screensaver-linux-x64-release
          cp "builds/$app-appimage/$app.AppImage" "dist/openrct2-$ref-openrct2-screensaver-linux-x64-beta.AppImage"
          ls -l dist
      - name: Create the draft release
        shell: bash
        run: |
          # The notes file's first line is the release's title ("# v0.2.0: ..."), the rest its notes
          title=$(head -n 1 "docs/releases/$TAG.md" | sed 's/^# *//')
          tail -n +2 "docs/releases/$TAG.md" > notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$title" \
            --notes-file notes.md dist/*
